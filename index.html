<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE CONSTRUCT // TERMINAL</title>
    <style>
        :root {
            --bg-color: #050505;
            --terminal-green: #00FF41;
            --dim-green: #003B0F;
            --border-color: #1a1a1a;
            --text-glow: 0 0 8px rgba(0, 255, 65, 0.4);
        }

        body {
            background-color: var(--bg-color);
            /* bg-game.png with a light dark wash. Raise the 0.3 alpha to dim it, lower to brighten. */
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
                url('assets/bg-game.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--terminal-green);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .layout-wrapper {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 1100px;
            height: 85vh;
            box-sizing: border-box;
        }

        .terminal-container {
            flex-grow: 1;
            height: 100%;
            border: 1px solid var(--terminal-green);
            box-shadow: var(--text-glow);
            background-color: rgba(8, 8, 8, 1);   /* semi-transparent so the body image shows through */
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            min-width: 0;
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            border: 1px solid var(--dim-green);
            background-color: #060806;
            padding: 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .sidebar h3 {
            margin: 0 0 8px 0;
            border-bottom: 1px solid var(--dim-green);
            padding-bottom: 4px;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 5px;
            gap: 5px;
        }

        .stat-name {
            color: #88aa88;
            white-space: nowrap;
        }

        .stat-val {
            color: var(--terminal-green);
            font-weight: bold;
            text-align: right;
        }

        .terminal-header {
            border-bottom: 1px solid var(--dim-green);
            padding-bottom: 8px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            letter-spacing: 2px;
        }

        .terminal-window {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 12px;
            padding-right: 5px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
        }

        .terminal-window::-webkit-scrollbar {
            width: 5px;
        }
        .terminal-window::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        .terminal-window::-webkit-scrollbar-thumb {
            background: var(--dim-green);
        }

        .message {
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 0.95rem;
        }

        .message.system {
            color: var(--terminal-green);
        }

        .message.user {
            color: #ffffff;
            background: #111111;
            padding: 8px 10px;
            border-left: 3px solid var(--terminal-green);
        }

        .scene-image {
            max-width: 100%;
            border: 1px solid var(--dim-green);
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.15);
            margin: 10px 0;
            border-radius: 2px;
            opacity: 0.9;
        }

        .input-form {
            display: flex;
            gap: 8px;
            border-top: 1px solid var(--dim-green);
            padding-top: 12px;
        }

        .prompt-symbol {
            font-weight: bold;
            font-size: 1rem;
            align-self: center;
        }

        .terminal-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            outline: none;
        }

        .terminal-input:disabled {
            color: #555555;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            body {
                display: block;
                padding: 6px;
            }

            .layout-wrapper {
                flex-direction: column;
                height: auto;
                width: 100%;
                gap: 8px;
            }

            .sidebar {
                width: 100%;
                order: -1;
                max-height: none;
                overflow-y: visible;
                padding: 10px;
            }
        }

        /* ---- Finale: a centered terminal window, same look as the game, no HUD ---- */
        body.finale-mode .sidebar,
        body.finale-mode .terminal-header,
        body.finale-mode .input-form {
            display: none;
        }
        body.finale-mode.finale-retry .input-form {
            display: flex;
        }
        body.finale-mode .layout-wrapper {
            max-width: 780px;
            height: 78vh;
        }
        body.finale-mode .terminal-container {
            justify-content: flex-start;
            animation: finaleFade 1.4s ease both;
        }
        body.finale-mode .terminal-window {
            overflow-y: auto;
            justify-content: flex-start;
            gap: 12px;
        }
        body.finale-mode.finale-end .terminal-window {
            justify-content: center;
        }
        body.finale-mode .message {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.92rem;
            line-height: 1.7;
            color: #ffffff;
            text-shadow: none;
            white-space: pre-wrap;
        }
        body.finale-mode .finale-hint {
            color: #4a7a4a;
            font-size: 0.8rem;
            letter-spacing: 2px;
            margin-top: 6px;
            animation: caretBlink 1.2s step-end infinite;
        }
        body.finale-mode .finale-head {
            color: #3f7a3f;
            font-size: 0.74rem;
            letter-spacing: 3px;
            border-bottom: 1px solid #234023;
            padding-bottom: 8px;
            margin-bottom: 4px;
        }
        body.finale-mode .finale-readout {
            border-top: 1px solid #234023;
            border-bottom: 1px solid #234023;
            padding: 10px 0;
            margin: 4px 0;
            max-width: 100%;
            font-size: 0.86rem;
        }
        body.finale-mode .ro-title {
            color: #3f7a3f;
            font-size: 0.7rem;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }
        body.finale-mode .ro-row {
            display: flex;
            gap: 14px;
            line-height: 1.95;
        }
        body.finale-mode .ro-k {
            color: #5f9f5f;
            min-width: 10.5em;
            flex-shrink: 0;
        }
        body.finale-mode .ro-v { color: #ffffff; }
        body.finale-mode .final-line {
            color: #ffffff;
            font-style: normal;
            font-size: 0.9rem;
            text-align: center;
            letter-spacing: 1px;
            animation: finaleFade 1.1s ease both;
        }
        body.finale-mode .final-line.done::after {
            content: "_";
            animation: caretBlink 1.1s step-end infinite;
        }
        body.finale-mode .finale-qr {
            width: 44%;
            max-width: 200px;
            margin: 6px auto;
            display: block;
            border: 1px solid var(--dim-green);
            image-rendering: pixelated;
        }

        .terminal-container { background-color: rgba(8, 8, 8, 0.45); }

        @keyframes finaleFade {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        @keyframes caretBlink {
            50% { opacity: 0; }
        }
    </style>
</head>

        function unlockAndBoot() {
            if (!ACCESS_KEY) {

            if (!ACCESS_KEY) {
                turnIndicator.textContent = "LOCKED";
                userInput.disabled = true;
                userInput.placeholder = "reload the page to enter a key";

                return;

            try { localStorage.setItem("construct_key", ACCESS_KEY); } catch (_) {}
            // wake the free-tier server now, while the player spends ~1 min on setup

        function typeWriterEffect(text, element, callback) {
            let i = 0;
            const speed = 10;
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    scrollToBottom();
                    setTimeout(type, speed);
                } else if (callback) {
                    callback();
                }
            }
            type();
        }

        function typeBootLine(text) {
            return new Promise((resolve) => {
                const div = document.createElement("div");
                div.className = "message system";
                terminalWindow.appendChild(div);
                scrollToBottom();

                typeWriterEffect(text, div, () => {
                    resolve();
                });
            });
        }

        function typeInto(element, text, speed) {
            return new Promise((resolve) => {
                let i = 0;
                (function step() {
                    if (i < text.length) {
                        element.textContent += text.charAt(i++);
                        scrollToBottom();
                        setTimeout(step, speed);
                    } else {
                        resolve();
                    }
                })();
            });
        }

        const delay = (ms) => new Promise((r) => setTimeout(r, ms));
        const GLYPHS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&*+=-<>/\\|{}";

        // Two loose frontiers: `head` (where glyph-churn has reached) and `locked` (real
        // text). Both advance by small-biased random amounts each frame, and `locked`
        // sometimes stalls - so the churn zone breathes: a burst loads ~1-2 words of
        // glyphs, some resolve, then it surges again. Never strictly word-by-word.
        function typeDecrypt(element, text, opts = {}) {
            const tick = opts.tick ?? 33;
            const zoneCap = opts.zoneCap ?? 30;
            return new Promise((resolve) => {
                const N = text.length;
                let head = 0, locked = 0;
                function step() {
                    head += 0.5 + Math.random() * Math.random() * 8.5;      // small-biased, occasional bursts
                    if (head > N) head = N;
                    if (Math.random() > 0.28) {                             // ~1 frame in 4, resolving stalls
                        locked += 0.35 + Math.random() * Math.random() * 6.5;
                    }
                    if (head - locked > zoneCap) locked = head - zoneCap;
                    if (locked > head) locked = head;

                    const lk = Math.floor(locked), hd = Math.floor(head);
                    let out = text.slice(0, lk);
                    for (let i = lk; i < hd; i++) {
                        out += /\s/.test(text[i]) ? text[i] : GLYPHS[(Math.random() * GLYPHS.length) | 0];
                    }
                    element.textContent = out;
                    scrollToBottom();

                    if (locked >= N) { element.textContent = text; resolve(); return; }
                    setTimeout(step, tick);
                }
                step();
            });
        }

        function waitForEnter() {
            return new Promise((resolve) => {
                function done() {
                    window.removeEventListener("keydown", onKey);
                    terminalWindow.removeEventListener("click", done);
                    resolve();
                }
                function onKey(e) {
                    if (e.key === "Enter") { e.preventDefault(); done(); }
                }
                window.addEventListener("keydown", onKey);
                terminalWindow.addEventListener("click", done);
            });
        }

        // Resolves on ANY key or click (no prompt shown to the player).
        function waitForAny() {
            return new Promise((resolve) => {
                function done() {
                    window.removeEventListener("keydown", done);
                    window.removeEventListener("click", done);
                    resolve();
                }
                window.addEventListener("keydown", done);
                window.addEventListener("click", done);
            });
        }

        // A system-printout of the player's real record, from gameState.turn_log.
        async function renderReadout(t) {
            const log = Array.isArray(gameState.turn_log) ? gameState.turn_log : [];
            const counts = {};
            let wins = 0, probes = 0;
            const itemsUsed = new Set();
            for (const e of log) {
                if (!e) continue;
                if (e.stat) counts[e.stat] = (counts[e.stat] || 0) + 1;
                if (e.success) wins++;
                if (e.probed) probes++;
                if (e.item) itemsUsed.add(e.item);
            }
            const sn = t.statNames || {};
            const nm = (s) => sn[s] || String(s).toUpperCase().replace(/_/g, " ");
            const leaned = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([s]) => nm(s));
            const core = ["tech", "charm", "fitness", "intellect", "combat"];
            const never = core.filter((s) => !counts[s]).map(nm);
            const carried = Array.isArray(gameState.inventory) ? gameState.inventory : [];

            const rows = [
                [t.roTurns, String(log.length)],
                [t.roLeaned, leaned.join("  ·  ") || "—"],
                [t.roNever, never.join("  ·  ") || "—"],
                [t.roOutcome, `${wins} / ${log.length - wins}`],
                [t.roProbes, String(probes)],
                [t.roItems, carried.join(",  ") || t.none],
            ];

            const box = document.createElement("div");
            box.className = "message finale-readout";
            const title = document.createElement("div");
            title.className = "ro-title";
            box.appendChild(title);
            terminalWindow.appendChild(box);

            await typeInto(title, t.roTitle, 12);
            for (const [key, val] of rows) {
                const r = document.createElement("div");
                r.className = "ro-row";
                const k = document.createElement("span");
                k.className = "ro-k";
                k.textContent = key;
                const v = document.createElement("span");
                v.className = "ro-v";
                r.append(k, v);
                box.appendChild(r);
                await typeInto(v, val, 9);
                await delay(70);
            }
        }

        async function fetchRandomLocation(attempt = 1) {
            userInput.disabled = true;
            const t = translations[gameState.language] || translations.en;
            turnIndicator.textContent = t.locGenHeader;

            let loadingDiv = terminalWindow.querySelector(".loc-loading");
            if (!loadingDiv) {
                loadingDiv = document.createElement("div");
                loadingDiv.className = "message system loc-loading";
                loadingDiv.style.fontStyle = "italic";
                terminalWindow.appendChild(loadingDiv);
            }
            loadingDiv.textContent = attempt === 1
                ? t.locGenLoading
                : t.locGenRetry.replace("{n}", attempt);
            scrollToBottom();

            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 45000);
            try {
                const response = await fetch(`${API_BASE}/api/generate-location`, {
                    method: "POST",
                    headers: apiHeaders(),
                    body: JSON.stringify({ current_state: gameState }),
                    signal: ctrl.signal
                });
                clearTimeout(timer);

                if (response.status === 401) {
                    clearKey();
                    loadingDiv.remove();
                    addMessage(t.accessDenied, "system");
                    userInput.disabled = false;
                    return;
                }
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                if (!data || !data.location_name) throw new Error("empty location payload");

                loadingDiv.remove();
                gameState.current_location = data.location_name;
                gameState.current_scenario = data.scenario_description || "";
                const fullText = `SYSTEM: [LOC: ${data.location_name}]\n${data.scenario_description}\n${t.rerollPrompt}`;

                const sceneDiv = document.createElement("div");
                sceneDiv.className = "message system";
                terminalWindow.appendChild(sceneDiv);

                typeWriterEffect(fullText, sceneDiv, () => {
                    userInput.placeholder = t.placeholderLocation;
                    userInput.disabled = false;
                    userInput.focus();
                    updateHUD();
                });
            } catch (err) {
                clearTimeout(timer);
                console.error("location gen failed:", err);
                if (attempt < 3) {
                    await new Promise(r => setTimeout(r, 1500));
                    return fetchRandomLocation(attempt + 1);
                }
                loadingDiv.textContent = t.locGenFail;
                userInput.placeholder = t.locGenFailPh;
                userInput.disabled = false;
                userInput.focus();
            }
        }

        async function runBootSequence() {

        actionForm.addEventListener("submit", async function(e) {
            e.preventDefault();
            const inputVal = userInput.value.trim();
            const inputValUpper = inputVal.toUpperCase();
            const t = translations[gameState.language] || translations.en;

            if (gamePhase === "finale_retry") {
                const ans = inputVal.toLowerCase();
                userInput.value = "";
                const YES = ["yes", "y", "oui", "o", "ja", "j", "да", "д"];
                const NO = ["no", "n", "non", "nein", "нет", "н", "не"];
                if (YES.includes(ans)) {
                    location.reload();
                } else if (NO.includes(ans)) {
                    gamePhase = "finale_done";
                    userInput.disabled = true;
                    userInput.blur();
                    document.body.classList.remove("finale-retry");
                    terminalWindow.innerHTML = "";
                    const m = document.createElement("div");
                    m.className = "message final-line";
                    terminalWindow.appendChild(m);
                    await typeInto(m, t.finaleStay, 46);
                }
                return;
            }

            if (gamePhase === "select_lang") {
                if (inputValUpper === 'A') gameState.language = 'en';
                else if (inputValUpper === 'B') gameState.language = 'fr';
                else if (inputValUpper === 'C') gameState.language = 'de';
                else if (inputValUpper === 'D') gameState.language = 'ru';
                else {
                    addMessage(translations.en.selectError, "system");
                    userInput.value = "";
                    return;
                }

                const activeT = translations[gameState.language];
                gameState.inventory = [activeT.startingItem];

                userInput.value = "";
                gamePhase = "boot_sequence_run";
                terminalWindow.innerHTML = "";
                turnIndicator.textContent = activeT.sysInitHeader;

                for (let line of activeT.boot) {
                    await typeBootLine(line);
                    await new Promise(r => setTimeout(r, 900));
                }

                gamePhase = "gender_select";
                turnIndicator.textContent = activeT.bioSetupHeader;
                typeQuestion(activeT.genderPrompt);
                updateHUD();
                return;
            }

            if (gamePhase === "gender_select") {
                if (inputValUpper !== 'A' && inputValUpper !== 'B' && inputValUpper !== 'C') {
                    addMessage(t.invalidInput, "system");
                    userInput.value = "";
                    return;
                }
                let setMsg = "";
                if (inputValUpper === 'A') { gameState.player_gender = "Female"; setMsg = t.classSetFemale; }
                else if (inputValUpper === 'B') { gameState.player_gender = "Male"; setMsg = t.classSetMale; }
                else { gameState.player_gender = "Other"; setMsg = t.classSetOther; }

                addMessage(`> ${setMsg}`, "user");
                userInput.value = "";

                gamePhase = "profiler";
                turnIndicator.textContent = t.diagnosticHeader;
                const qList = profilerQuestionsByLang[gameState.language];
                typeQuestion(qList[0]);
                return;
            }

            if (gamePhase === "profiler") {
                if (inputValUpper !== 'A' && inputValUpper !== 'B' && inputValUpper !== 'C') {
                    addMessage(t.invalidInput, "system");
                    userInput.value = "";
                    return;
                }

                if (currentProfilerStep === 0) {
                    if (inputValUpper === 'A') { gameState.metrics.tech += 3; gameState.metrics.intellect += 2; }
                    else if (inputValUpper === 'B') { gameState.metrics.fitness += 3; gameState.metrics.combat += 2; }
                    else { gameState.metrics.cautiousness += 3; gameState.metrics.stress_tolerance += 2; }
                } else if (currentProfilerStep === 1) {
                    if (inputValUpper === 'A') { gameState.metrics.alignment -= 3; gameState.metrics.cautiousness += 2; }
                    else if (inputValUpper === 'B') { gameState.metrics.alignment += 3; gameState.metrics.charm += 2; }
                    else { gameState.metrics.wealth += 2; gameState.metrics.charm += 1; }
                } else if (currentProfilerStep === 2) {
                    if (inputValUpper === 'A') { gameState.metrics.language += 3; gameState.metrics.charm += 2; }
                    else if (inputValUpper === 'B') { gameState.metrics.intellect += 3; gameState.metrics.stress_tolerance += 2; }
                    else { gameState.metrics.fitness += 3; gameState.metrics.combat += 2; }
                } else if (currentProfilerStep === 3) {
                    if (inputValUpper === 'A') { gameState.metrics.combat += 3; gameState.metrics.stress_tolerance += 2; }
                    else if (inputValUpper === 'B') { gameState.metrics.cautiousness += 3; gameState.metrics.presence += 1; }
                    else { gameState.metrics.tech += 3; gameState.metrics.language += 2; }
                } else if (currentProfilerStep === 4) {
                    if (inputValUpper === 'A') { gameState.metrics.wealth += 4; gameState.metrics.alignment -= 2; }
                    else if (inputValUpper === 'B') { gameState.metrics.alignment += 3; gameState.metrics.presence += 2; }
                    else { gameState.metrics.intellect += 3; gameState.metrics.cautiousness += 2; }
                } else if (currentProfilerStep === 5) {
                    if (inputValUpper === 'A') { gameState.metrics.presence += 3; gameState.metrics.combat += 1; }
                    else if (inputValUpper === 'B') { gameState.metrics.language += 3; gameState.metrics.charm += 2; }
                    else { gameState.metrics.wealth += 3; gameState.metrics.charm += 1; }
                } else if (currentProfilerStep === 6) {
                    if (inputValUpper === 'A') { gameState.metrics.intellect += 3; gameState.metrics.cautiousness += 2; }
                    else if (inputValUpper === 'B') { gameState.metrics.stress_tolerance += 3; gameState.metrics.combat += 1; }
                    else { gameState.metrics.stress_tolerance += 4; gameState.metrics.presence += 1; }
                }

                addMessage(`> ${t.chosenOption}${inputValUpper}`, "user");
                userInput.value = "";
                updateHUD();

                currentProfilerStep++;
                const qList = profilerQuestionsByLang[gameState.language];

                if (currentProfilerStep < qList.length) {
                    typeQuestion(qList[currentProfilerStep]);
                } else {
                    gamePhase = "location_select";
                    await typeBootLine(t.reestablishing);
                    await new Promise(r => setTimeout(r, 800));
                    terminalWindow.innerHTML = "";
                    fetchRandomLocation();
                }
                return;
            }

            if (gamePhase === "location_select") {
                if (inputVal.toLowerCase() === "reroll" || inputVal.toLowerCase() === "autre" || inputVal.toLowerCase() === "neu" || inputVal.toLowerCase() === "другой") {
                    userInput.value = "";
                    terminalWindow.innerHTML = "";
                    fetchRandomLocation();
                    return;
                }

                // no location loaded (generation failed / still pending) - regenerate, don't start
                if (!gameState.current_location || gameState.current_location === "OFFLINE") {
                    userInput.value = "";
                    terminalWindow.innerHTML = "";
                    fetchRandomLocation();
                    return;
                }

                gamePhase = "playing";
                gameState.is_active = true;
                turnIndicator.textContent = `${t.turnHeaderPrefix}: ${gameState.turn_count}/${gameState.max_turns}`;
                
                const lockMsg = t.locationLockedMsg.replace("{loc}", gameState.current_location);
                if (gameState.current_scenario) {
                    gameState.narrative_history.push(`SYSTEM: [SCENE] ${gameState.current_scenario}`);
                }
                gameState.narrative_history.push(`SYSTEM: ${lockMsg} Initial action: ${inputVal}`);
                updateHUD();

                userInput.value = "";
                userInput.disabled = true;

                const respDiv = document.createElement("div");
                respDiv.className = "message system";
                terminalWindow.appendChild(respDiv);

                typeWriterEffect(lockMsg, respDiv, () => {
                    userInput.placeholder = t.placeholderAction;
                    userInput.disabled = false;
                    userInput.focus();
                });
                return;
            }

            if (gamePhase === "playing") {
                const actionText = inputVal;
                if (!actionText || !gameState.is_active) return;

                userInput.value = "";
                userInput.disabled = true;

                const userDiv = document.createElement("div");
                userDiv.className = "message user";
                userDiv.textContent = `USER: ${actionText}`;
                terminalWindow.appendChild(userDiv);
                scrollToBottom();

                gameState.narrative_history.push(`\nUSER: ${actionText}\n`);
                
                const loadingIndicator = document.createElement("div");
                loadingIndicator.className = "message system";
                loadingIndicator.style.fontStyle = "italic";
                loadingIndicator.textContent = t.loadingTurn;
                terminalWindow.appendChild(loadingIndicator);
                scrollToBottom();

                try {
                    const response = await fetch(`${API_BASE}/api/turn`, {
                        method: "POST",
                        headers: apiHeaders(),
                        body: JSON.stringify({
                            user_action: actionText,
                            current_state: gameState
                        })
                    });

                    if (response.status === 401) {
                        clearKey();
                        throw new Error(t.accessDenied);
                    }

                    if (!response.ok) {
                        let detail = "";
                        try { detail = (await response.json()).detail || ""; } catch (_) {}
                        throw new Error(`ENGINE ${response.status}${detail ? " :: " + detail : ""}`);
                    }

                    const data = await response.json();
                    if (!data || !data.new_state) throw new Error("ENGINE RETURNED NO STATE");

                    gameState = data.new_state;
                    if (!gameState.metrics || typeof gameState.metrics !== "object") gameState.metrics = {};
                    if (!Array.isArray(gameState.narrative_history)) gameState.narrative_history = [];

                    if (loadingIndicator.parentNode) terminalWindow.removeChild(loadingIndicator);

                    const hist = gameState.narrative_history;
                    const latestText = String(hist[hist.length - 1] || "")
                        .replace("SYSTEM: ", "").replace("FINALE: ", "").trim();

                    // Turn 15 resolves: hand off to the mystical single-window finale.
                    if (!gameState.is_active) {
                        renderFinale(latestText);
                        return;
                    }

                    turnIndicator.textContent = `${t.turnHeaderPrefix}: ${gameState.turn_count}/${gameState.max_turns}`;
                    updateHUD();

                    // render the scene image (http URL or base64 data: URI) if the engine sent one
                    if (gameState.latest_image_url) {
                        const img = document.createElement("img");
                        img.className = "scene-image";
                        img.alt = "Generated scene visual";
                        img.onload = () => scrollToBottom();
                        img.onerror = () => img.remove();
                        img.src = gameState.latest_image_url;
                        terminalWindow.appendChild(img);
                        scrollToBottom();

                        // drop it before the next POST so we don't re-upload a big data URI
                        gameState.latest_image_url = null;
                    }

                    const responseDiv = document.createElement("div");
                    responseDiv.className = "message system";
                    terminalWindow.appendChild(responseDiv);

                    typeWriterEffect(latestText, responseDiv, () => {
                        userInput.disabled = false;
                        userInput.focus();
                    });

                } catch (error) {
                    console.error("Transmission error:", error);
                    if (loadingIndicator.parentNode) terminalWindow.removeChild(loadingIndicator);
                    addMessage(error.message || t.lostConnection, "system");
                    userInput.disabled = false;
                    userInput.focus();
                }
            }
        });

        window.onload = unlockAndBoot;
    </script>
</body>
</html>
